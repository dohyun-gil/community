version: "2.0"

services:
  provider-audit:
    image: zblocker64/overclock-test-deployment:0.3.3
    env:
      - AUDIT_STANDALONE_UI=1
      - AUDIT_HTTP_BIND=0.0.0.0
      - AUDIT_HTTP_PORT=8080
      - AUDIT_PROVIDER_ID=akash1cfsc8qjhav0g3vv3l8jtm7mly7a0vxtrugrv7x
      - AUDIT_TIMEOUT_SECONDS=3600
      - AUDIT_PV_MOUNT_PATH=/data
      - AUDIT_RAM_REQUIRED=true
      - AUDIT_RAM_MOUNT_PATH=/dev/shm
      - AUDIT_GPU_ENABLED=true
    params:
      storage:
        data:
          mount: /data
          readOnly: false
        shm:
          mount: /dev/shm
    expose:
      - port: 8080
        as: 80
        to:
          - global: true

profiles:
  compute:
    provider-audit:
      resources:
        cpu:
          units: 8
        memory:
          size: 16Gi
        storage:
          - size: 100Gi
          - name: data
            size: 50Gi
            attributes:
              persistent: true
              class: beta3
          - name: shm
            size: 10Gi
            attributes:
              persistent: false
              class: ram
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
  placement:
    akash:
      attributes:
        host: baremetal
      pricing:
        provider-audit:
          denom: uact
          amount: 100000

deployment:
  provider-audit:
    akash:
      profile: provider-audit
      count: 1

